apiVersion: apps/v1
kind: Deployment
metadata:
  name: localization-api1
  labels:
    app: localization-api
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localization-api
      version: v1
  template:
    metadata:
      labels:
        app: localization-api
        version: v1
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
        cluster: rasp1
      containers:
        - name: localization-api
          image: wrathchild14/localization-reg:latest
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          resources:
            requests:
              cpu: "200m"
              memory: 256Mi
            limits:
              cpu: "2000m"
              memory: 2Gi
          ports:
            - containerPort: 8000

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: localization-api2
  labels:
    app: localization-api
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localization-api
      version: v2
  template:
    metadata:
      labels:
        app: localization-api
        version: v2
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
        cluster: rasp2
      containers:
        - name: localization-api
          image: wrathchild14/localization-reg:latest
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          resources:
            requests:
              cpu: "200m"
              memory: 256Mi
            limits:
              cpu: "2000m"
              memory: 2Gi
          ports:
            - containerPort: 8000

---

apiVersion: v1
kind: Service
metadata:
  name: localization-service1
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8000
  selector:
    app: localization-api
    version: v1

---

apiVersion: v1
kind: Service
metadata:
  name: localization-service2
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8000
  selector:
    app: localization-api
    version: v2

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: localization-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503 http_504"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "100"
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      - pathType: ImplementationSpecific
        path: /api1/(.*)
        backend:
          service:
            name: localization-service1
            port:
              number: 8081
      - pathType: ImplementationSpecific
        path: /api2/(.*)
        backend:
          service:
            name: localization-service2
            port:
              number: 8082
