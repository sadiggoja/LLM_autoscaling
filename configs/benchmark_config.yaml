# Benchmark Configuration
#
# Default = RL (PPO, DDPG, MDQN) + heuristic VPA on the homogeneous localization
# workload. LLM agents are commented out — uncomment if you have an Ollama
# server running and want to compare LLM-based scaling.

# Algorithms to benchmark
algorithms:
  - name: "ppo"
    type: "rl"
    model_path: "trained/ppo/1000ep_rf_2_20rps10kepochs5alpha10epupdate50scale_a_1000resources"
  - name: "ddpg"
    type: "rl"
    model_path: "trained/ddpg/1000ep_2rf_20rps5.0alpha_50scale1000resources"
  - name: "mdqn"
    type: "rl"
    model_path: "trained/dqn/mdqn1000ep1000m25inc2_rf_20rps5.0alpha1000res"
  # k8s_vpa: in-place VPA heuristic (RL-comparable). Uses the VPA recommender
  # rule but actuates in-place via the env, so it needs NO real VPA operator.
  - name: "k8s_vpa"
    type: "heuristic"

  # ----- Optional: uncomment to enable additional baselines -----
  #
  # LLM entry with a list of models: the runner expands this into one
  # benchmark run per model, each saved under its own algorithm name
  # (e.g. llm_ollama_qwen2_5_7b, llm_ollama_gemma2_9b, ...).
  # Provider must be one of: "ollama", "anthropic". Connection details
  # (base_url, max_tokens) come from configs/llm_config.yaml.
  # action_mode (optional): "vpa" | "hpa" | "both"
  #
  # - name: "llm"
  #   type: "llm"
  #   provider: "ollama"
  #   action_mode: "vpa"
  #   models:
  #     - "mistral:latest"
  #     - "llama3:8b"
  #
  # - name: "threshold"
  #   type: "heuristic"
  #
  # - name: "k8s_hpa"
  #   type: "heuristic"
  #   apply_yaml: "configs/localization/hpa/config.yaml"
  #
  # k8s_vpa_real: passive baseline driven by the real (restart-based) VPA
  # operator. Requires running scripts/microk8s/install_vpa.sh first.
  # - name: "k8s_vpa_real"
  #   type: "heuristic"
  #   apply_yaml: "configs/localization/vpa/config.yaml"

# General settings
iterations: 20
action_interval: 1.0
resources: 1000
steps_per_phase: 60

# Load patterns (phases within a single benchmark run)
load_patterns:
  - name: "low"
    rps: 10
    duration_steps: 60
  - name: "medium"
    rps: 30
    duration_steps: 60
  - name: "high"
    rps: 50
    duration_steps: 60

# Scalability scenarios
scenarios:
  small:
    service_count: 2
    total_resources: 2000
  medium:
    service_count: 10
    total_resources: 3000
  large:
    service_count: 20
    total_resources: 6000

# Metrics collection
metrics:
  sla_threshold_ms: 250
  collection_interval: 1.0

# Output
output_dir: "results/benchmark"
